    <main id="demo">
      <noscript>
        <h1>Scopes</h1>
        <p>
          Waveform, vectorscope, histogram and picture assist in one FFGL
          effect. Drop it on a layer and it measures what's arriving there,
          either in place of the picture or over it in a corner.
        </p>
        <p>
          This demo runs the plugin's shader in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/resolume-scopes/">its project page</a>.
        </p>
